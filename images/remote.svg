<svg xmlns="http://www.w3.org/2000/svg" width="300" height="560" viewBox="0 0 300 560" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4051"/>
      <stop offset="1" stop-color="#232734"/>
    </linearGradient>
    <radialGradient id="btnHi" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0c7a37"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#37d67a" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- body -->
  <rect x="60" y="20" width="180" height="520" rx="40" fill="url(#body)" stroke="#0e1116" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="20" width="180" height="520" rx="40" fill="none" stroke="#4a5266" stroke-width="1" opacity="0.5"/>

  <!-- brand + status LED -->
  <text x="150" y="66" text-anchor="middle" fill="#e8ebf2" font-size="18" font-weight="700" letter-spacing="0.5">RealMote</text>
  <circle cx="150" cy="92" r="6" fill="url(#led)" filter="url(#glow)"/>
  <text x="150" y="116" text-anchor="middle" fill="#8a93a6" font-size="9" letter-spacing="1.5">SMART REMOTE</text>

  <!-- 6 buttons: 2 cols x 3 rows -->
  <g>
    <!-- row 1 -->
    <g>
      <circle cx="112" cy="185" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="112" cy="185" r="34" fill="url(#btnHi)"/>
      <text x="112" y="192" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">1</text>
    </g>
    <g>
      <circle cx="188" cy="185" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="188" cy="185" r="34" fill="url(#btnHi)"/>
      <text x="188" y="192" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">2</text>
    </g>
    <!-- row 2 -->
    <g>
      <circle cx="112" cy="285" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="112" cy="285" r="34" fill="url(#btnHi)"/>
      <text x="112" y="292" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">3</text>
    </g>
    <g>
      <circle cx="188" cy="285" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="188" cy="285" r="34" fill="url(#btnHi)"/>
      <text x="188" y="292" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">4</text>
    </g>
    <!-- row 3 -->
    <g>
      <circle cx="112" cy="385" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="112" cy="385" r="34" fill="url(#btnHi)"/>
      <text x="112" y="392" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">5</text>
    </g>
    <g>
      <circle cx="188" cy="385" r="34" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/>
      <circle cx="188" cy="385" r="34" fill="url(#btnHi)"/>
      <text x="188" y="392" text-anchor="middle" fill="#dfe4ee" font-size="22" font-weight="600">6</text>
    </g>
  </g>

  <!-- accent bar -->
  <rect x="112" y="470" width="76" height="6" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="150" y="502" text-anchor="middle" fill="#8a93a6" font-size="10" letter-spacing="0.5">Home Assistant · MQTT</text>
</svg>
