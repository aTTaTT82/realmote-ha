<svg xmlns="http://www.w3.org/2000/svg" width="340" height="320" viewBox="0 0 340 320" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4051"/>
      <stop offset="1" stop-color="#232734"/>
    </linearGradient>
    <radialGradient id="btnHi" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0c7a37"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-160%" y="-160%" width="420%" height="420%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#37d67a" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- body (breit: 3 Tasten nebeneinander) -->
  <rect x="20" y="16" width="300" height="288" rx="34" fill="url(#body)" stroke="#0e1116" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="16" width="300" height="288" rx="34" fill="none" stroke="#4a5266" stroke-width="1" opacity="0.5"/>

  <!-- brand + status LED -->
  <circle cx="52" cy="50" r="6" fill="url(#led)" filter="url(#glow)"/>
  <text x="170" y="56" text-anchor="middle" fill="#e8ebf2" font-size="20" font-weight="700" letter-spacing="0.5">RealMote</text>
  <text x="170" y="78" text-anchor="middle" fill="#8a93a6" font-size="9" letter-spacing="2">SMART REMOTE</text>

  <!-- 6 Tasten: 3 Spalten x 2 Reihen -->
  <g>
    <!-- Reihe 1: 1 2 3 -->
    <g><circle cx="95"  cy="150" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="95"  cy="150" r="32" fill="url(#btnHi)"/><text x="95"  y="157" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">1</text></g>
    <g><circle cx="170" cy="150" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="170" cy="150" r="32" fill="url(#btnHi)"/><text x="170" y="157" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">2</text></g>
    <g><circle cx="245" cy="150" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="245" cy="150" r="32" fill="url(#btnHi)"/><text x="245" y="157" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">3</text></g>
    <!-- Reihe 2: 4 5 6 -->
    <g><circle cx="95"  cy="235" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="95"  cy="235" r="32" fill="url(#btnHi)"/><text x="95"  y="242" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">4</text></g>
    <g><circle cx="170" cy="235" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="170" cy="235" r="32" fill="url(#btnHi)"/><text x="170" y="242" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">5</text></g>
    <g><circle cx="245" cy="235" r="32" fill="url(#btn)" stroke="#10131a" stroke-width="1.5"/><circle cx="245" cy="235" r="32" fill="url(#btnHi)"/><text x="245" y="242" text-anchor="middle" fill="#dfe4ee" font-size="21" font-weight="600">6</text></g>
  </g>

  <!-- accent + footer -->
  <rect x="132" y="284" width="76" height="5" rx="2.5" fill="#22c55e" opacity="0.85"/>
</svg>
